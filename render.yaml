# Blueprint для Render: создаёт базу PostgreSQL и сайт одной кнопкой
databases:
  - name: riskcontrol-db
    plan: free
    databaseName: riskcontrol
    user: riskcontrol

services:
  - type: web
    name: riskcontrol
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: riskcontrol-db
          property: connectionString
      # внутри сети Render соединение с базой идёт без SSL
      - key: PGSSL
        value: disable
