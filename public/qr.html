<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiskControl — QR-код</title>
  <script src="/qr.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033; background: #f5f7fb;
    }
    .poster {
      width: 100%; max-width: 520px; padding: 40px 32px; text-align: center;
      border: 1px solid #e8ecf3; border-radius: 18px; background: #fff;
      box-shadow: 0 10px 30px rgba(23, 32, 51, 0.06);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; letter-spacing: -0.8px; }
    .brand-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; color: #fff; background: #4169e1; }
    .brand span span { color: #4169e1; }
    h1 { margin: 26px 0 8px; font-size: 22px; }
    p { margin: 0 0 26px; color: #64748b; line-height: 1.5; }
    #qr svg { width: 100%; max-width: 340px; height: auto; }
    .url { margin: 18px 0 26px; color: #4169e1; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
    .alarm { display: inline-block; padding: 8px 14px; border-radius: 999px; color: #b91c1c; background: #fef2f2; font-size: 13px; font-weight: 700; }
    .actions { margin-top: 28px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .actions a, .actions button {
      min-height: 42px; padding: 0 18px; border: 0; border-radius: 9px; font: inherit; font-weight: 650;
      display: inline-flex; align-items: center; cursor: pointer; text-decoration: none;
    }
    .print { color: #fff; background: #4169e1; }
    .back { color: #33415c; background: #f1f4fa; }
    @media print {
      body { background: #fff; }
      .poster { border: 0; box-shadow: none; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <main class="poster">
    <div class="brand"><span class="brand-icon">R</span><span>Risk<span>Control</span></span></div>
    <h1>Сообщить о риске с телефона</h1>
    <p>Наведи камеру на QR-код — откроется панель мониторинга с тревожной кнопкой.</p>
    <div id="qr"></div>
    <div class="url" id="url"></div>
    <span class="alarm">🚨 Тревожная кнопка · аналитика 2 000 000 сигналов</span>
    <div class="actions">
      <button class="print" type="button" onclick="window.print()">Распечатать</button>
      <a class="back" href="/">← На панель</a>
    </div>
  </main>
  <script>
    const url = location.origin + "/";
    document.getElementById("qr").innerHTML = QR.svg(url, { size: 340 });
    document.getElementById("url").textContent = url.replace(/^https?:\/\//, "").replace(/\/$/, "");
  </script>
</body>
</html>
